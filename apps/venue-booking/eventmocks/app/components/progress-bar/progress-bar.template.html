<div class="progress-bar-container" role="navigation" aria-label="Form progress">
    <div class="progress-bar" role="list">
        <div class="progress-step" role="listitem" ng-repeat="step in $ctrl.steps"
             ng-class="{active: $ctrl.currentStep >= step.step, complete: $ctrl.currentStep > step.step}"
             aria-current="{{$ctrl.currentStep === step.step ? 'step' : undefined}}">
            <div class="step-circle" aria-hidden="true">{{step.step}}</div>
            <span>{{step.label}}</span>
        </div>
    </div>
</div>
