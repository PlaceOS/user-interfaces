<!doctype html>
<!--
    Return page of hosted payment pages. The app checks the payment with the
    driver, so this page only closes the payment window.
-->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Payment</title>
        <style>
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
                font-family: system-ui, sans-serif;
                color: #1f2937;
                background-color: #f5f5f5;
                text-align: center;
            }

            @media (prefers-color-scheme: dark) {
                body {
                    color: #f5f5f5;
                    background-color: #1f2937;
                }
            }
        </style>
    </head>
    <body>
        <p id="message">You can close this window and go back to the app.</p>
        <script>
            const state = new URLSearchParams(location.search).get('state');
            if (state === 'cancel') {
                document.getElementById('message').textContent =
                    'Payment cancelled. You can close this window.';
            }
            setTimeout(() => window.close(), 1000);
        </script>
    </body>
</html>
