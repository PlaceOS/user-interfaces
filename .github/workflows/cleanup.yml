name: 'Cleanup PR Branches'

on:
    schedule:
        - cron: '0 0 * * 6'

permissions:
    contents: write

jobs:
    cleanup_pr_branches:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: '2'

            - name: Delete orphaned feat/fix/custom build branches
              shell: bash
              run: |
                  set -euo pipefail

                  git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

                  git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/build/feat refs/remotes/origin/build/fix refs/remotes/origin/build/custom | while read -r build_branch; do
                      source_branch="${build_branch#build/}"
                      source_branch="${source_branch%/*}"

                      if git show-ref --verify --quiet "refs/remotes/origin/${source_branch}"; then
                          echo "Keeping ${build_branch}; source branch ${source_branch} still exists."
                      else
                          echo "Deleting ${build_branch}; source branch ${source_branch} no longer exists."
                          git push origin --delete "${build_branch}"
                      fi
                  done
