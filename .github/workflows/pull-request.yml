name: 'PR Flow'

on:
    push:
        branches: [feat/*, fix/*, custom/*, refactor/*]
    pull_request:
        branches: [feat/*, fix/*, custom/*, refactor/*]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
    install_deps:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: '2'

            - name: Cache node modules
              id: cache
              uses: actions/cache@v5
              with:
                  path: node_modules
                  key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-build-${{ env.cache-name }}-
                      ${{ runner.os }}-build-
                      ${{ runner.os }}-

            - name: Setup Node.js environment
              uses: actions/setup-node@v6
              with:
                  node-version: '24'

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3.11'

            - name: Install dependencies
              if: steps.cache.outputs.cache-hit != 'true'
              run: bun install --frozen-lockfile

            - name: Get short hash
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

            - name: Extract branch name
              id: branch_name
              shell: bash
              run: echo "deploy_branch=${{github.ref_name}}" >> $GITHUB_OUTPUT

            - name: Extract build configuration
              shell: bash
              id: build_ext
              run: |
                  if [[ ${{ github.ref_name }} == custom/*-prod ]]
                  then
                      echo "configuration=production" >> $GITHUB_OUTPUT
                  elif [[ ${{ github.ref_name }} == *"feat"* ]]
                  then
                      echo "configuration=feat" >> $GITHUB_OUTPUT
                  elif [[ ${{ github.ref_name }} == *"fix"* ]]
                  then
                      echo "configuration=fix" >> $GITHUB_OUTPUT
                  elif [[ ${{ github.ref_name }} == *"custom"* ]]
                  then
                      echo "configuration=custom" >> $GITHUB_OUTPUT
                  else
                      echo "configuration=pr" >> $GITHUB_OUTPUT
                  fi
            - name: List affected applications
              id: affected_apps
              run: |
                  echo "affected_apps=$(node ./tools/get-affected.js ${{ github.ref }})" >> $GITHUB_OUTPUT
                  echo "affected_units=$(node ./tools/get-affected.js ${{ github.ref }} test)" >> $GITHUB_OUTPUT

            - name: Print affected applications
              run: |
                  echo ${{ steps.affected_apps.outputs.affected_apps }}

        outputs:
            affected_apps: ${{ steps.affected_apps.outputs.affected_apps }}
            affected_units: ${{ steps.affected_apps.outputs.affected_units }}
            configuration: ${{ steps.build_ext.outputs.configuration }}
            deploy_branch: ${{ steps.branch_name.outputs.deploy_branch }}
            short_sha: ${{ steps.vars.outputs.short_sha }}

    test:
        runs-on: ubuntu-latest
        needs: install_deps
        if: ${{ fromJSON(needs.install_deps.outputs.affected_apps)[0] != null }}
        strategy:
            matrix:
                package: ${{ fromJSON(needs.install_deps.outputs.affected_apps) }}
        env:
            jobCount: ${{ fromJSON(needs.install_deps.outputs.affected_apps).length }}
            configuration: ${{ needs.install_deps.outputs.configuration }}
            deploy_branch: ${{ needs.install_deps.outputs.deploy_branch }}
            short_sha: ${{ needs.install_deps.outputs.short_sha }}
        # Steps represent a sequence of tasks that will be executed as part of the job
        steps:
            - uses: actions/checkout@v6

            - name: Cache node modules
              id: cache
              uses: actions/cache@v5
              with:
                  path: node_modules
                  key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-build-${{ env.cache-name }}-
                      ${{ runner.os }}-build-
                      ${{ runner.os }}-

            - name: Cache nx build cahce
              id: cache-nx
              uses: actions/cache@v5
              with:
                  path: node_modules/.cache/nx
                  key: ${{ runner.os }}-nx-${{matrix.package}}-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-nx-${{matrix.package}}-
                      ${{ runner.os }}-nx-

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3.11'

            - name: Setup version
              run: bun run postinstall

            - name: Initialise Pipeline Chat Status
              run: |
                  curl --fail-with-body --silent --show-error --max-time 5 \
                    --request POST \
                    --header 'Content-Type: application/json' \
                    --data "$REQUEST_DATA" \
                    "$STATUS_URL"
              continue-on-error: true
              env:
                  STATUS_URL: ${{ secrets.STATUS_URL }}
                  REQUEST_DATA: '{ "chat_url": "${{ secrets.CHAT_URL }}", "name": "${{ github.repository }}", "commit": "${{ github.sha }}", "pipeline_name": "${{ matrix.package }}", "branch": "${{ github.ref }}", "status": "processing", "url": "https://github.com/${{ github.repository }}/runs/${{ github.run_id }}" }'

            - name: Build affected applications
              run: |
                  bunx nx test ${{ matrix.package }} --verbose --configuration=${{ env.configuration }}

            - name: Update Pipeline Chat Status
              run: |
                  curl --fail-with-body --silent --show-error --max-time 5 \
                    --request POST \
                    --header 'Content-Type: application/json' \
                    --data "$REQUEST_DATA" \
                    "$STATUS_URL"
              continue-on-error: true
              env:
                  STATUS_URL: ${{ secrets.STATUS_URL }}
                  REQUEST_DATA: '{ "name": "${{ github.repository }}", "commit": "${{ github.sha }}", "pipeline_name": "${{ matrix.package }}", "branch": "${{ github.ref }}", "status": "${{ job.status }}", "url": "https://github.com/${{ github.repository }}/runs/${{ github.run_id }}" }'
              if: ${{ always() }}

    build:
        runs-on: ubuntu-latest
        needs: install_deps
        if: ${{ fromJSON(needs.install_deps.outputs.affected_apps)[0] != null }}
        strategy:
            matrix:
                package: ${{ fromJSON(needs.install_deps.outputs.affected_apps) }}
        env:
            configuration: ${{ needs.install_deps.outputs.configuration }}
            deploy_branch: ${{ needs.install_deps.outputs.deploy_branch }}
            short_sha: ${{ needs.install_deps.outputs.short_sha }}
            type: ${{needs.install_deps.outputs.type}}
        # Steps represent a sequence of tasks that will be executed as part of the job
        steps:
            - uses: actions/checkout@v6

            - name: Cache node modules
              id: cache
              uses: actions/cache@v5
              with:
                  path: node_modules
                  key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-build-${{ env.cache-name }}-
                      ${{ runner.os }}-build-
                      ${{ runner.os }}-

            - name: Cache nx build cache
              id: cache-nx
              uses: actions/cache@v5
              with:
                  path: node_modules/.cache/nx
                  key: ${{ runner.os }}-nx-${{matrix.package}}-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-nx-${{matrix.package}}-
                      ${{ runner.os }}-nx-

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3.11'

            - name: Setup version
              run: bun run postinstall

            - name: Initialise Pipeline Chat Status
              run: |
                  curl --fail-with-body --silent --show-error --max-time 5 \
                    --request POST \
                    --header 'Content-Type: application/json' \
                    --data "$REQUEST_DATA" \
                    "$STATUS_URL"
              continue-on-error: true
              env:
                  STATUS_URL: ${{ secrets.STATUS_URL }}
                  REQUEST_DATA: '{ "chat_url": "${{ secrets.CHAT_URL }}", "name": "${{ github.repository }}", "commit": "${{ github.sha }}", "pipeline_name": "${{ matrix.package }}", "branch": "${{ github.ref }}", "status": "processing", "url": "https://github.com/${{ github.repository }}/runs/${{ github.run_id }}" }'

            - name: Build affected applications
              run: |
                  bunx nx build ${{ matrix.package }} --verbose --configuration=${{ env.configuration }}

            - name: Deploy the application(${{ matrix.package }})
              uses: MrYuion/git-publish-subdir-action@develop
              env:
                  REPO: self
                  BRANCH: build/${{env.deploy_branch}}/${{ matrix.package }} # The branch name where you want to push the assets
                  FOLDER: dist/apps/${{ matrix.package }}/browser # The directory where your assets are generated
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub will automatically add this - you don't need to bother getting a token
                  MESSAGE: 'build(${{ matrix.package }}): ${{env.type}}[${{env.deploy_branch}}][{sha}] CI build' # The commit message

            - name: Update Pipeline Chat Status
              run: |
                  curl --fail-with-body --silent --show-error --max-time 5 \
                    --request POST \
                    --header 'Content-Type: application/json' \
                    --data "$REQUEST_DATA" \
                    "$STATUS_URL"
              continue-on-error: true
              env:
                  STATUS_URL: ${{ secrets.STATUS_URL }}
                  REQUEST_DATA: '{ "name": "${{ github.repository }}", "commit": "${{ github.sha }}", "pipeline_name": "${{ matrix.package }}", "branch": "${{ github.ref }}", "status": "${{ job.status }}", "url": "https://github.com/${{ github.repository }}/runs/${{ github.run_id }}" }'
              if: ${{ always() }}
