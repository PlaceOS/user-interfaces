# This is a basic workflow to help you get started with Actions

name: BUILD

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
    push:
        branches: [develop, release/**, rc/**, release]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
    install_deps:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: '2'

            - name: Cache node modules
              id: cache
              uses: actions/cache@v5
              with:
                  path: node_modules
                  key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-build-${{ env.cache-name }}-
                      ${{ runner.os }}-build-
                      ${{ runner.os }}-

            - name: Setup Node.js environment
              uses: actions/setup-node@v6
              with:
                  node-version: '24'

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3.11'

            - name: Install dependencies
              if: steps.cache.outputs.cache-hit != 'true'
              run: bun install --frozen-lockfile

            - name: Get short hash
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

            - name: Extract branch name
              id: branch_name
              shell: bash
              run: echo "name=$(echo ${GITHUB_REF#refs/heads/} | sed 's/\//_/g')" >> $GITHUB_OUTPUT

            - name: Extract build configuration
              shell: bash
              id: build_ext
              run: |
                  if [[ ${{ steps.branch_name.outputs.name }} == "release" ]] || [[ ${{ steps.branch_name.outputs.name }} == "release"* ]] || [[ ${{ steps.branch_name.outputs.name }} == "main" ]]
                  then
                      echo "configuration=production" >> $GITHUB_OUTPUT
                      echo "deploy_branch=prod" >> $GITHUB_OUTPUT
                  elif [[ ${{ steps.branch_name.outputs.name }} == "rc"* ]]
                  then
                      echo "configuration=staging" >> $GITHUB_OUTPUT
                      echo "deploy_branch=uat" >> $GITHUB_OUTPUT
                  else
                      echo "configuration=staging" >> $GITHUB_OUTPUT
                      echo "deploy_branch=dev" >> $GITHUB_OUTPUT
                  fi
            - name: List affected applications
              id: affected_apps
              run: |
                  echo "affected_apps=$(node ./tools/get-affected.js ${{ github.ref }})" >> $GITHUB_OUTPUT
                  echo "affected_units=$(node ./tools/get-affected.js ${{ github.ref }} test)" >> $GITHUB_OUTPUT

            - name: Print affected applications
              run: |
                  echo ${{ steps.affected_apps.outputs.affected_apps }}

            - name: Fetch changelog history
              if: ${{ fromJSON(steps.affected_apps.outputs.affected_apps)[0] != null }}
              run: git fetch --force --prune --tags --unshallow

            - name: Resolve production version tag
              if: ${{ steps.build_ext.outputs.deploy_branch == 'prod' && fromJSON(steps.affected_apps.outputs.affected_apps)[0] != null }}
              run: |
                  version_tag="$(git tag --points-at HEAD --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
                  if [[ -z "${version_tag}" ]]; then
                      echo '::error::The production commit does not have a version tag.'
                      exit 1
                  fi
                  echo "Generating production changelog for ${version_tag}."

            - name: Generate changelog
              if: ${{ fromJSON(steps.affected_apps.outputs.affected_apps)[0] != null }}
              uses: orhun/git-cliff-action@v4
              with:
                  config: cliff.toml
                  args: --verbose
              env:
                  OUTPUT: ${{ runner.temp }}/CHANGELOG.md
                  GITHUB_REPO: ${{ github.repository }}

            - name: Upload changelog
              if: ${{ fromJSON(steps.affected_apps.outputs.affected_apps)[0] != null }}
              uses: actions/upload-artifact@v4
              with:
                  name: changelog-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/CHANGELOG.md
                  retention-days: 1

        outputs:
            affected_apps: ${{ steps.affected_apps.outputs.affected_apps }}
            affected_units: ${{ steps.affected_apps.outputs.affected_units }}
            configuration: ${{ steps.build_ext.outputs.configuration }}
            deploy_branch: ${{ steps.build_ext.outputs.deploy_branch }}
            short_sha: ${{ steps.vars.outputs.short_sha }}

    test:
        runs-on: ubuntu-latest
        needs: install_deps
        if: ${{ fromJSON(needs.install_deps.outputs.affected_units)[0] != null }}
        strategy:
            matrix:
                package: ${{ fromJSON(needs.install_deps.outputs.affected_units) }}
        steps:
            - uses: actions/checkout@v6

            - name: Cache node modules
              id: cache
              uses: actions/cache@v5
              with:
                  path: node_modules
                  key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-build-${{ env.cache-name }}-
                      ${{ runner.os }}-build-
                      ${{ runner.os }}-

            - name: Cache nx build cache
              id: cache-nx
              uses: actions/cache@v5
              with:
                  path: node_modules/.cache/nx
                  key: ${{ runner.os }}-nx-${{matrix.package}}-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-nx-${{matrix.package}}-
                      ${{ runner.os }}-nx-

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3.11'

            - name: Setup version
              run: bun run postinstall

            - name: Test affected code units
              run: |
                  bunx nx test ${{ matrix.package }}

    build:
        runs-on: ubuntu-latest
        needs: install_deps
        if: ${{ fromJSON(needs.install_deps.outputs.affected_apps)[0] != null }}
        strategy:
            matrix:
                package: ${{ fromJSON(needs.install_deps.outputs.affected_apps) }}
        env:
            configuration: ${{ needs.install_deps.outputs.configuration }}
            deploy_branch: ${{ needs.install_deps.outputs.deploy_branch }}
            short_sha: ${{ needs.install_deps.outputs.short_sha }}
        # Steps represent a sequence of tasks that will be executed as part of the job
        steps:
            - uses: actions/checkout@v6

            - name: Cache node modules
              id: cache
              uses: actions/cache@v5
              with:
                  path: node_modules
                  key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-build-${{ env.cache-name }}-
                      ${{ runner.os }}-build-
                      ${{ runner.os }}-

            - name: Cache nx build cache
              id: cache-nx
              uses: actions/cache@v5
              with:
                  path: node_modules/.cache/nx
                  key: ${{ runner.os }}-nx-${{matrix.package}}-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-nx-${{matrix.package}}-
                      ${{ runner.os }}-nx-

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3.11'

            - name: Setup version
              run: bun run postinstall

            - name: Initialise Pipeline Chat Status
              run: |
                  curl --fail-with-body --silent --show-error --max-time 5 \
                    --request POST \
                    --header 'Content-Type: application/json' \
                    --data "$REQUEST_DATA" \
                    "$STATUS_URL"
              continue-on-error: true
              env:
                  STATUS_URL: ${{ secrets.STATUS_URL }}
                  REQUEST_DATA: '{ "chat_url": "${{ secrets.CHAT_URL }}", "name": "${{ github.repository }}", "commit": "${{ github.sha }}", "pipeline_name": "${{ matrix.package }}", "branch": "${{ github.ref }}", "status": "processing", "url": "https://github.com/${{ github.repository }}/runs/${{ github.run_id }}" }'

            - name: Build affected applications
              run: |
                  bunx nx build ${{ matrix.package }} --verbose --configuration=${{ env.configuration }}

            - name: Add changelog to build
              uses: actions/download-artifact@v4
              with:
                  name: changelog-${{ github.run_attempt }}
                  path: dist/apps/${{ matrix.package }}/browser

            - name: Deploy the application(${{ matrix.package }})
              run: .github/scripts/publish-subdir.sh
              env:
                  BRANCH: build/${{ matrix.package }}/${{ env.deploy_branch }} # The branch name where you want to push the assets
                  FOLDER: dist/apps/${{ matrix.package }}/browser # The directory where your assets are generated
                  MESSAGE: 'build(${{ matrix.package }}): [{sha}] CI build' # The commit message

            - name: Update Pipeline Chat Status
              run: |
                  curl --fail-with-body --silent --show-error --max-time 5 \
                    --request POST \
                    --header 'Content-Type: application/json' \
                    --data "$REQUEST_DATA" \
                    "$STATUS_URL"
              continue-on-error: true
              env:
                  STATUS_URL: ${{ secrets.STATUS_URL }}
                  REQUEST_DATA: '{ "name": "${{ github.repository }}", "commit": "${{ github.sha }}", "pipeline_name": "${{ matrix.package }}", "branch": "${{ github.ref }}", "status": "${{ job.status }}", "url": "https://github.com/${{ github.repository }}/runs/${{ github.run_id }}" }'
              if: ${{ always() }}
