name: MOBILE

# `rc/**` pushes and `mobile/v<version>` tags build all mobile applications.
# A `mobile/<app>/v<version>` tag builds one application. GitHub ignores
# `paths` for tag pushes.
on:
    workflow_dispatch:
    push:
        branches: [rc/**]
        tags: ['mobile/v[0-9]*', 'mobile/*/v[0-9]*']
        paths:
            - 'apps/workplace/**'
            - 'apps/booking-panel/**'
            - 'apps/control/**'
            - 'libs/**'
            - 'tools/capacitor/**'
            - 'package.json'
            - 'bun.lock'
            - 'nx.json'
            - '.github/workflows/mobile.yml'

jobs:
    select_apps:
        runs-on: ubuntu-latest
        outputs:
            apps: ${{ steps.apps.outputs.apps }}
        steps:
            # A full checkout fetches all branches for the tag source check.
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Check release tag source
              if: ${{ github.ref_type == 'tag' }}
              run: .github/scripts/check-release-source.sh

            # tools/capacitor/apps.json lists the mobile applications.
            - name: Select mobile applications
              id: apps
              run: |
                  apps="$(jq -c 'keys' tools/capacitor/apps.json)"
                  if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == mobile/*/* ]]; then
                      app="$(cut -d/ -f2 <<< "$GITHUB_REF_NAME")"
                      if ! jq -e --arg app "$app" 'any(. == $app)' <<< "$apps" > /dev/null; then
                          echo "::error::Tag names unknown mobile application \"${app}\"."
                          exit 1
                      fi
                      apps="$(jq -cn --arg app "$app" '[$app]')"
                  fi
                  echo "apps=${apps}" >> "$GITHUB_OUTPUT"

    android:
        runs-on: ubuntu-latest
        needs: select_apps
        strategy:
            matrix:
                app: ${{ fromJSON(needs.select_apps.outputs.apps) }}
        steps:
            - uses: actions/checkout@v6

            - name: Setup Node.js environment
              uses: actions/setup-node@v6
              with:
                  node-version: '26'

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.4.3'

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '21'

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Setup version
              run: bun run postinstall

            - name: Build Android artifact
              run: bunx nx run ${{ matrix.app }}:"mobile:build:android"

            - name: Upload Android artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.app }}-android-debug
                  path: .capacitor/${{ matrix.app }}/artifacts/${{ matrix.app }}-android-debug.apk
                  if-no-files-found: error

    ios:
        runs-on: macos-latest
        needs: select_apps
        strategy:
            matrix:
                app: ${{ fromJSON(needs.select_apps.outputs.apps) }}
        steps:
            - uses: actions/checkout@v6

            - name: Setup Node.js environment
              uses: actions/setup-node@v6
              with:
                  node-version: '26'

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.4.3'

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Setup version
              run: bun run postinstall

            - name: Build iOS simulator artifact
              run: bunx nx run ${{ matrix.app }}:"mobile:build:ios"

            - name: Upload iOS artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.app }}-ios-simulator
                  path: .capacitor/${{ matrix.app }}/artifacts/${{ matrix.app }}-ios-simulator.zip
                  if-no-files-found: error
