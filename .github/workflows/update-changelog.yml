name: 'Update Changelog'

on:
    push:
        tags:
            - 'v[0-9]*'

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: update-changelog
    cancel-in-progress: false

jobs:
    update_changelog:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout tag
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.ref }}
                  fetch-depth: 0

            - name: Generate changelog
              uses: orhun/git-cliff-action@v4
              with:
                  config: cliff.toml
                  args: --verbose
              env:
                  OUTPUT: ${{ runner.temp }}/CHANGELOG.md
                  GITHUB_REPO: ${{ github.repository }}

            - name: Checkout develop
              uses: actions/checkout@v6
              with:
                  ref: develop
                  fetch-depth: 0

            - name: Commit changelog and open pull request
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ github.ref_name }}
              run: |
                  cp "${RUNNER_TEMP}/CHANGELOG.md" CHANGELOG.md

                  if git diff --quiet -- CHANGELOG.md; then
                      echo "CHANGELOG.md is already up to date."
                      exit 0
                  fi

                  git config user.name 'github-actions[bot]'
                  git config user.email 'github-actions[bot]@users.noreply.github.com'
                  git add CHANGELOG.md
                  git commit -m "docs(changelog): update for ${VERSION}"

                  branch="custom/changelog-${VERSION}"
                  if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null; then
                      git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
                  fi
                  git push --force-with-lease origin "HEAD:refs/heads/${branch}"

                  pull_request_url="$(
                      gh pr list \
                          --base develop \
                          --head "${branch}" \
                          --state open \
                          --json url \
                          --jq '.[0].url // ""'
                  )"

                  if [[ -n "${pull_request_url}" ]]; then
                      echo "Updated ${pull_request_url}"
                      exit 0
                  fi

                  gh pr create \
                      --base develop \
                      --head "${branch}" \
                      --title "docs(changelog): update for ${VERSION}" \
                      --body "Updates CHANGELOG.md for ${VERSION}."
