name: 'Cleanup Build Branches'

on:
    schedule:
        - cron: '0 0 1 * *'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: cleanup-build-branches
    cancel-in-progress: false

jobs:
    cleanup_build_branches:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Prune old build commits
              shell: bash
              run: |
                  set -euo pipefail

                  cutoff_date="$(date -u -d '12 months ago' '+%Y-%m-%dT%H:%M:%SZ')"
                  export GIT_COMMITTER_NAME='github-actions[bot]'
                  export GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'

                  rewrite_branch() {
                      local build_branch="$1"
                      local total_count="$2"
                      local description="$3"
                      local commit_count="${#commits[@]}"
                      local tmp_branch="cleanup-${build_branch//\//-}-${GITHUB_RUN_ID}"
                      local first_commit="${commits[0]}"
                      local original_head
                      original_head="$(git rev-parse HEAD)"

                      git switch --quiet --orphan "${tmp_branch}"
                      git rm --quiet -r --cached . >/dev/null 2>&1 || true
                      git clean --quiet -d --force
                      git checkout --quiet "${first_commit}" -- .

                      local author_name
                      local author_email
                      local author_date
                      local commit_date
                      local commit_message
                      author_name="$(git show -s --format='%an' "${first_commit}")"
                      author_email="$(git show -s --format='%ae' "${first_commit}")"
                      author_date="$(git show -s --format='%aI' "${first_commit}")"
                      commit_date="$(git show -s --format='%cI' "${first_commit}")"
                      commit_message="$(git show -s --format='%B' "${first_commit}")"

                      GIT_AUTHOR_NAME="${author_name}" \
                      GIT_AUTHOR_EMAIL="${author_email}" \
                      GIT_AUTHOR_DATE="${author_date}" \
                      GIT_COMMITTER_DATE="${commit_date}" \
                          git commit --quiet -F - <<< "${commit_message}"

                      if (( commit_count > 1 )); then
                          for commit in "${commits[@]:1}"; do
                              GIT_COMMITTER_DATE="$(git show -s --format='%cI' "${commit}")" git cherry-pick --quiet "${commit}"
                          done
                      fi

                      git push origin "${tmp_branch}:refs/heads/${build_branch}" --force-with-lease="refs/heads/${build_branch}:$(git rev-parse "origin/${build_branch}")"
                      git switch --quiet --detach "${original_head}"
                      git branch --quiet -D "${tmp_branch}"

                      echo "Pruned ${build_branch} from ${total_count} to ${commit_count} build commits (${description})."
                  }

                  git fetch origin '+refs/heads/build/*:refs/remotes/origin/build/*' --prune

                  git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/build | while read -r build_branch; do
                      total_count="$(git rev-list --count "origin/${build_branch}")"

                      if [[ "${build_branch}" == build/*/dev ]]; then
                          recent_commits="$(git rev-list --reverse --since="${cutoff_date}" "origin/${build_branch}")"

                          if [[ -z "${recent_commits}" ]]; then
                              if (( total_count <= 5 )); then
                                  echo "Keeping ${build_branch}; no build commits found since ${cutoff_date}, and it only has ${total_count} build commits."
                                  continue
                              fi

                              latest_commits="$(git rev-list --max-count=5 "origin/${build_branch}" | tac)"
                              mapfile -t commits <<< "${latest_commits}"

                              rewrite_branch "${build_branch}" "${total_count}" 'last 5 builds because none are within the last 12 months'
                              continue
                          fi

                          mapfile -t commits <<< "${recent_commits}"

                          if [[ "${#commits[@]}" == "${total_count}" ]]; then
                              echo "Keeping ${build_branch}; all ${total_count} build commits are within the last 12 months."
                              continue
                          fi

                          rewrite_branch "${build_branch}" "${total_count}" 'last 12 months'
                      elif [[ "${build_branch}" == build/feat/* || "${build_branch}" == build/fix/* ]]; then
                          if (( total_count <= 5 )); then
                              echo "Keeping ${build_branch}; it only has ${total_count} build commits."
                              continue
                          fi

                          latest_commits="$(git rev-list --max-count=5 "origin/${build_branch}" | tac)"
                          mapfile -t commits <<< "${latest_commits}"

                          rewrite_branch "${build_branch}" "${total_count}" 'last 5 builds'
                      fi
                  done
