# Isolated PlaceOS stack for e2e.
#
# Deliberately NOT the PlaceOS/local stack. Two reasons:
#
#  1. Isolation. PlaceOS/local hardcodes `container_name` on every service and
#     pins its network to a fixed name + subnet, so a second copy of it collides
#     with a running one. Everything here is project-scoped (no container_name,
#     no fixed network name), so it can run alongside a developer's own stack
#     without touching it.
#  2. It is what CI needs. This is a trimmed stack — only what the workplace e2e
#     path actually exercises. Dropped from PlaceOS/local: core, edge, triggers,
#     dispatch, source, frontend-loader, influx, chronograf, mosquitto, minio and
#     the loki/promtail/grafana profile. That is roughly half the containers and
#     most of the RAM.
#
# frontend-loader IS required, despite the SPA being served by the Angular dev
# server. It does not only deploy app builds: on startup it clones
# PlaceOS/www-core into the shared `www` volume, and that is where the platform's
# own /login page, /scripts and /styles come from. Without it nginx serves a bare
# 404 at /login and the real-login spec dead-ends. (Consequence for CI: bringing
# this stack up needs network access to GitHub once, to populate the volume.)
#
# Bring it up with ./up.sh — it generates secrets and seeds before returning.

volumes:
  postgres-data:
  elastic-data:
  redis-data:
  nginx-data:
  www:

x-deployment-env: &deployment-env
  PLACE_LOG_FORMAT: JSON
  LOG_LEVEL: ${LOG_LEVEL:-warn}
  ENV: development
  SG_ENV: development
  TZ: ${TZ:-UTC}

x-postgresdb-client-env: &postgresdb-client-env
  PG_HOST: postgres
  PG_PORT: 5432
  PG_DB: placeos
  PG_USER: placeos
  PG_PASSWORD: development
  PG_DATABASE: placeos
  PG_DATABASE_URL: postgresql://placeos:development@postgres:5432/placeos

x-elastic-client-env: &elastic-client-env
  ELASTIC_HOST: elastic
  ELASTIC_PORT: 9200
  ES_HOST: elastic
  ES_PORT: 9200

x-redis-client-env: &redis-client-env
  REDIS_URL: redis://redis:6379

x-search-ingest-client-env: &search-ingest-client-env
  PLACE_SEARCH_INGEST_URI: http://search-ingest:3000

x-logging: &std-logging
  logging:
    driver: json-file
    options:
      max-size: 25m

services:
  postgres:
    image: postgres:18-alpine # 18: migrations use uuidv7(), a PG18 builtin
    hostname: postgres
    restart: unless-stopped
    <<: *std-logging
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U placeos -d placeos']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      <<: *postgresdb-client-env
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: placeos
      POSTGRES_PASSWORD: development
      POSTGRES_DB: placeos
      TZ: ${TZ:-UTC}

  elastic:
    # STILL HERE ON PURPOSE — do not delete without reading this.
    #
    # PPT-2644 moved rest-api's search off Elasticsearch and onto Postgres, and
    # this service was removed on that basis in 16dc58f4 (merged 2026-08-13).
    # That merge broke CI for 11 days, because the stack pins
    # `${PLACEOS_TAG:-latest}` and `latest` is the RELEASE channel, not develop:
    # it was `placeos-2.2608.1`, cut before PPT-2644 landed. A rest-api without
    # PG search and without an `elastic` service falls back to its default host
    # and every index route 500s with
    #
    #     Error connecting to '127.0.0.1:9200': Connection refused
    #
    # which surfaces as the seed's `GET /oauth_apps` failing in `up.sh`.
    #
    # The rule this violated: THE STACK'S COMPOSITION MUST MATCH THE IMAGE
    # CHANNEL IT PINS. Removing this is safe only once the image that
    # `${PLACEOS_TAG:-latest}` resolves to actually contains PPT-2644. Check
    # before you do, do not infer it from the rest-api repo:
    #
    #     docker pull placeos/rest-api:latest
    #     docker image inspect placeos/rest-api:latest \
    #       --format '{{index .Config.Labels "org.opencontainers.image.version"}}'
    #     # then, in the rest-api clone:
    #     git merge-base --is-ancestor 51faa1a <that release's revision>
    #
    # As of 2026-08-24 that is false for `latest` and true for `nightly`. When it
    # flips, re-apply 16dc58f4 (it reverts cleanly) rather than redoing the work.
    #
    # A LATE 7.17 patch, not the 7.17.6 that PlaceOS/local pins.
    #
    # 7.17.6 bundles a JDK with the cgroup v2 NPE bug: its launcher dies in
    # `JvmOptionsParser` -> `DefaultSystemMemoryInfo` with "Cannot invoke
    # CgroupInfo.getMountPoint() because anyController is null" before the JVM even
    # starts, so no ES_JAVA_OPTS setting can work around it. GitHub runners use
    # cgroup v2; Docker Desktop's VM does not, which is why this passes locally and
    # failed the first two CI runs. Staying on the 7.x line keeps client
    # compatibility with rest-api and search-ingest, which is what PlaceOS/local
    # exercises.
    image: elasticsearch:${E2E_ELASTIC_VERSION:-7.17.28}
    hostname: elastic
    restart: always
    <<: *std-logging
    healthcheck:
      test: curl --silent --fail localhost:9200/_cat/health
      interval: 10s
      start_period: 60s
      retries: 20
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    # `bootstrap.memory_lock` is OFF deliberately.
    #
    # PlaceOS/local enables it, but it requires an unlimited `memlock` rlimit or
    # Elasticsearch refuses to boot ("memory locking requested ... but memory is
    # not locked") — the container exits, and `compose --wait` reports it as
    # unhealthy within seconds rather than after its retry budget. Docker Desktop
    # grants that rlimit by default, so this only bites in CI: it is what failed
    # the first GitHub Actions run. Memory locking is production tuning and buys
    # a throwaway test stack nothing. The ulimits below make it work either way.
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    environment:
      bootstrap.memory_lock: 'false'
      cluster.routing.allocation.disk.threshold_enabled: 'false'
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: ${TZ:-UTC}

  redis:
    # Pinned: keydb is not the system under test, so a moving tag here can only
    # ever add noise. The PlaceOS services deliberately stay on ${PLACEOS_TAG}
    # (see up.sh) because catching backend regressions is the point of the
    # nightly — but that argument does not apply to infrastructure.
    #
    # By digest, not tag: upstream publishes only arch-specific version tags
    # (`x86_64_v6.3.4`, `arm64_v6.3.4`), and pinning one would break either the
    # Intel runner or an Apple Silicon laptop. This is the multi-arch manifest
    # list for `latest` as of 2026-08-05 — which upstream last moved in 2023.
    image: eqalpha/keydb@sha256:6537505c42355ca1f571276bddf83f5b750f760f07b2a185a676481791e388ac
    hostname: redis
    restart: always
    <<: *std-logging
    healthcheck:
      test: keydb-cli ping
    volumes:
      - redis-data:/data
    environment:
      TZ: ${TZ:-UTC}

  search-ingest:
    image: placeos/search-ingest:${PLACEOS_TAG:-latest}
    hostname: search-ingest
    restart: always
    <<: *std-logging
    depends_on:
      elastic: { condition: service_healthy }
      postgres: { condition: service_healthy }
    environment:
      <<: [*deployment-env, *postgresdb-client-env, *elastic-client-env]

  # Populates the shared `www` volume from PlaceOS/www-core — the source of the
  # platform /login page that the real-login spec drives.
  frontend-loader:
    image: placeos/frontend-loader:${PLACEOS_TAG:-latest}
    hostname: frontend-loader
    restart: always
    <<: *std-logging
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - www:/app/www
    env_file:
      - .secrets/.env.secret_key
    environment:
      <<: [*deployment-env, *postgresdb-client-env]
      PLACE_LOADER_WWW: www

  auth:
    # Overridable so the suite can be run against a specific auth build — the
    # image path is fixed because nginx/rest-api resolve it by hostname only.
    image: ${E2E_AUTH_IMAGE:-placeos/auth:${PLACEOS_TAG:-latest}}
    hostname: auth
    restart: always
    <<: *std-logging
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    env_file:
      - .secrets/.env.secret_key
    environment:
      <<: [*postgresdb-client-env, *redis-client-env]
      COAUTH_NO_SSL: 'true'
      TZ: ${TZ:-UTC}
      PLACE_URI: https://${E2E_DOMAIN:-localhost:9443}

  rest-api:
    image: placeos/rest-api:${PLACEOS_TAG:-latest}
    hostname: api # load-bearing: nginx upstream is `api`
    restart: always
    <<: *std-logging
    depends_on:
      postgres: { condition: service_healthy }
      elastic: { condition: service_healthy }
      redis: { condition: service_started }
    env_file:
      - .secrets/.env.public_key
      - .secrets/.env.secret_key
    environment:
      <<:
        [
          *deployment-env,
          *postgresdb-client-env,
          *elastic-client-env,
          *redis-client-env,
          *search-ingest-client-env,
        ]

  staff-api:
    image: placeos/staff-api:${PLACEOS_TAG:-latest}
    hostname: staff # load-bearing: nginx upstream is `staff`
    restart: unless-stopped
    <<: *std-logging
    depends_on:
      postgres: { condition: service_healthy }
    env_file:
      - .secrets/.env.public_key
      - .secrets/.env.secret_key
    environment:
      <<: [*postgresdb-client-env, *redis-client-env]
      SG_ENV: production
      STAFF_TIME_ZONE: ${TZ:-UTC}
      PLACE_URI: 'https://nginx'
      SSL_VERIFY_NONE: 'true'
      # NOTE: under concurrent `POST /bookings` staff-api occasionally raises
      # `DB::ConnectionLost` (a 500). Reproduced roughly 1 run in 8 with 4
      # workers, on stock connection settings — which PlaceOS/local also ships.
      # Left at the defaults deliberately: tuning the pool here was tried and did
      # not demonstrably help, and hiding a real backend behaviour behind rig
      # config would be worse than knowing about it. The specs sweep and retry
      # instead. Worth investigating in staff-api on its own merits.

  nginx:
    image: placeos/nginx:${PLACEOS_TAG:-latest}
    hostname: nginx
    restart: always
    <<: *std-logging
    # Shifted off 8080/8443 so this can run beside a developer's own stack.
    ports:
      - '${E2E_HTTP_PORT:-9080}:80'
      - '${E2E_HTTPS_PORT:-9443}:443'
    healthcheck:
      test: "bash -c ': &>/dev/null </dev/tcp/127.0.0.1/80'"
      interval: 5s
      retries: 20
    depends_on:
      - rest-api
      - auth
      - staff-api
    volumes:
      - www:/etc/nginx/html/
      - nginx-data:/etc/nginx/ssl
    env_file:
      - .secrets/.env.secret_key
      - .secrets/.env.public_key
    environment:
      TZ: ${TZ:-UTC}
      PLACE_DOMAIN: ${E2E_DOMAIN:-localhost:9443}

  # One-shot seeder: authority, admin user, backoffice OAuth app, placeholder
  # zones/systems. Run by up.sh via `compose run --rm init start`.
  init:
    image: placeos/init:${PLACEOS_TAG:-latest}
    restart: 'no'
    <<: *std-logging
    depends_on:
      postgres: { condition: service_healthy }
    env_file:
      - .secrets/.env.secret_key
    environment:
      <<: [*deployment-env, *postgresdb-client-env, *elastic-client-env]
      PLACE_DOMAIN: ${E2E_DOMAIN:-localhost:9443}
      PLACE_APPLICATION: backoffice
      PLACE_AUTH_HOST: auth:8080
      PLACE_USERNAME: E2E Admin
      PLACE_EMAIL: ${E2E_ADMIN_EMAIL:-support@place.tech}
      PLACE_PASSWORD: ${E2E_ADMIN_PASSWORD:-development}
      PLACE_TLS: 'true'
