# The e2e stack's MQTT broker. PlaceOS/local's config/mosquitto, with one fix:
# the auth routes. rest-api serves them at `mqtt/user` and `mqtt/access`
# (controllers/mqtt.cr); PlaceOS/local names `mqtt/mqtt_user` and
# `mqtt/mqtt_access`, which answer 404, so every client is refused.
#
# 1883 is where source publishes, 9001 is the websocket listener nginx proxies
# `/api/mqtt/` to. Every client and topic is checked with rest-api, so the specs
# exercise the same access control a deployment does.
listener 1883
listener 9001
protocol websockets

auth_plugin /mosquitto/go-auth.so
auth_opt_backends jwt
auth_opt_jwt_mode remote
auth_opt_jwt_host api
auth_opt_jwt_port 3000
auth_opt_jwt_getuser_uri /api/engine/v2/mqtt/user
auth_opt_jwt_aclcheck_uri /api/engine/v2/mqtt/access
auth_opt_jwt_response_mode status
auth_opt_jwt_params_mode form
